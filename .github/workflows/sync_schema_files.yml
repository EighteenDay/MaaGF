name: Sync JSON Schema Files from MaaFramework

on:
  schedule:
    - cron: '10 0 * * *'  # UTC 00:10 每天运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-schema-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download JSON schema files from MaaFramework
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/MaaXYZ/MaaFramework/main/tools"
          mkdir -p deps/tools
          for name in interface interface_config interface_import pipeline custom.action custom.recognition; do
            echo "downloading ${name}.schema.json"
            curl -fsSL --retry 3 --retry-delay 2 -o "deps/tools/${name}.schema.json" "${base}/${name}.schema.json"
          done
          ls -la deps/tools/*.schema.json

      - name: Commit and push if changed
        run: |
          git add deps/tools/*.schema.json
          if git diff-index --quiet HEAD --; then
            echo "No changes detected in JSON schema files"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 同步 MaaFramework JSON Schema" -m "Triggered by ${GITHUB_SHA}" -m "[skip changelog]"
          git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
          git push
